server {
  listen 80;
  root /usr/share/nginx/html;

  # Mesmo domínio para interface e API: o cookie de sessão funciona sem CORS.
  location /api/ {
    proxy_pass http://api:8000;
    client_max_body_size 4m; # capa do projeto (limite de 3 MB no servidor)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:8000;
  }

  # Rotas da SPA voltam ao index ao recarregar o navegador.
  location / {
    try_files $uri /index.html;
  }
}
