[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "projeta"
version = "0.1.0"
description = "Gestão de projetos com assistente pessoal integrado."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "openai>=1.50",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/projeta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "S", "RUF"]
ignore = ["E501", "S608", "S101"]  # S608: SQL só com fragmentos fixos, valores por parâmetro; S101: assert só estreita tipos (retorno de INSERT ... RETURNING)

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "SLF001", "S311"]
"scripts/*" = ["S105", "S106"]
